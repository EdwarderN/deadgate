# Run by hand when a GitHub Pages publish is stuck "in progress" and blocks new ones:
# give it the commit the error message names, and it cancels that publish.
name: Cancel a stuck Pages publish

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: The build version (commit) named in the "in progress deployment" error
        required: true

permissions:
  pages: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT: ${{ inputs.deployment }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/deployments/$DEPLOYMENT/cancel"
